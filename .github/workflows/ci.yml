name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-test-train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 src tests --max-line-length=110 --statistics

      - name: Run unit tests
        run: |
          pytest tests/ -v --junitxml=reports/junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: reports/junit.xml

      - name: Download dataset
        run: python -m src.data.download_data

      - name: Preprocess data
        run: python -m src.data.preprocess

      - name: Run EDA
        run: python -m src.data.eda

      - name: Train models (with MLflow tracking)
        run: python -m src.models.train

      - name: Upload trained model artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: saved_models/

      - name: Upload MLflow run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlruns
          path: mlruns/

      - name: Upload EDA figures
        uses: actions/upload-artifact@v4
        with:
          name: eda-figures
          path: reports/figures/

  docker-build:
    needs: lint-test-train
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download trained model artifact
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: saved_models/

      - name: Build Docker image
        run: docker build -t heart-disease-api:${{ github.sha }} .

      - name: Smoke-test container
        run: |
          docker run -d --name heart-api -p 8000:8000 heart-disease-api:${{ github.sha }}
          for i in $(seq 1 10); do
            curl -sf http://localhost:8000/health && break
            sleep 3
          done
          curl -sf http://localhost:8000/health
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d @sample_request.json
          docker stop heart-api
